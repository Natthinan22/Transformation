<!DOCTYPE html>
<html>
<head>
    <title>Raster Graphics - Paint App</title>  
    <style>
        body { font-family: sans-serif; }
        .toolbar { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .active-tool { background-color: #007bff; color: white; border: 1px solid #0056b3; }
        kbd { background: #eee; border: 1px solid #ccc; border-radius: 3px; padding: 2px 5px; font-size: 11px; }
    </style>
</head>
<body>

<canvas id="canvas" width="200" height="200"
style="width:500px; height:500px; border:1px solid #000; image-rendering: pixelated;">
</canvas>

<div class="toolbar">
    <button id="btn-pencil" onclick="setTool('pencil')">Pencil <kbd>P</kbd></button>
    <button id="btn-line" onclick="setTool('line')">Line <kbd>L</kbd></button>
    <button id="btn-rect" onclick="setTool('rect')">Rectangle <kbd>R</kbd></button>
    <button id="btn-circle" onclick="setTool('circle')">Circle <kbd>C</kbd></button>
    <button id="btn-eraser" onclick="setTool('eraser')">Eraser <kbd>E</kbd></button>
    <button onclick="clearCanvas()">Clear <kbd>Del</kbd></button>

    | Color:
    <input type="color" id="colorPicker" value="#000000">

    | Thickness (<span id="thickVal">1</span>px):
    <input type="range" id="thick" min="1" max="10" value="1">
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const imageData = ctx.createImageData(canvas.width, canvas.height);
const data = imageData.data;

let isDragging = false;
let previousMouseX = 0;
let previousMouseY = 0;

let r = 0, g = 0, b = 0; // สีหลัก
let savedR = 0, savedG = 0, savedB = 0; // บันทึกสีไว้เมื่อสลับไปใช้ยางลบ

let thickness = 1;
let tool = "pencil";
let startX, startY;

const picker = document.getElementById("colorPicker");
const slider = document.getElementById("thick");
const thickValDisplay = document.getElementById("thickVal");

// ฟังก์ชันระบาย Pixel ลงใน ImageData
function putPixel(x, y, red, green, blue, alpha = 255) {
    if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) return;
    const index = (Math.floor(y) * canvas.width + Math.floor(x)) * 4;
    data[index] = red;
    data[index + 1] = green;
    data[index + 2] = blue;
    data[index + 3] = alpha;
}

// อัลกอริทึมวาดเส้นตรง (Bresenham-like / DDA)
function drawLine(x1, y1, x2, y2, red, green, blue, alpha = 255) {
    const dx = Math.abs(x2 - x1);
    const dy = Math.abs(y2 - y1);

    if (dx === 0 && dy === 0) {
        putPixel(x1, y1, red, green, blue, alpha);
        return;
    }

    if (dx > dy) {
        const m = (y2 - y1) / (x2 - x1);
        const c = y1 - m * x1;
        const step = x1 < x2 ? 1 : -1;
        for (let x = x1; x !== x2 + step; x += step) {
            const y = Math.round(m * x + c);
            putPixel(x, y, red, green, blue, alpha);
        }
    } else {
        const m = (x2 - x1) / (y2 - y1);
        const c = x1 - m * y1;
        const step = y1 < y2 ? 1 : -1;
        for (let y = y1; y !== y2 + step; y += step) {
            const x = Math.round(m * y + c);
            putPixel(x, y, red, green, blue, alpha);
        }
    }
}

// วาดเส้นแบบมีความหนา
function drawLineThick(x1, y1, x2, y2, red, green, blue, alpha = 255) {
    const halfThick = Math.floor(thickness / 2);
    for (let i = -halfThick; i <= halfThick; i++) {
        drawLine(x1 + i, y1, x2 + i, y2, red, green, blue, alpha);
        drawLine(x1, y1 + i, x2, y2 + i, red, green, blue, alpha);
    }
}

function drawRect(x1, y1, x2, y2, red, green, blue, alpha = 255) {
    drawLine(x1, y1, x2, y1, red, green, blue, alpha);
    drawLine(x2, y1, x2, y2, red, green, blue, alpha);
    drawLine(x2, y2, x1, y2, red, green, blue, alpha);
    drawLine(x1, y2, x1, y1, red, green, blue, alpha);
}

function drawCircle(cx, cy, radius, red, green, blue, alpha = 255) {
    drawEllipse(cx, cy, radius, radius, red, green, blue, alpha);
}

function drawEllipse(cx, cy, rx, ry, red, green, blue, alpha = 255) {
    for (let y = -ry; y <= ry; y++) {
        for (let x = -rx; x <= rx; x++) {
            if ((x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1) {
                putPixel(cx + x, cy + y, red, green, blue, alpha);
            }
        }
    }
}

function clearCanvas() {
    for (let i = 0; i < data.length; i += 4) {
        data[i] = 0;
        data[i + 1] = 0;
        data[i + 2] = 0;
        data[i + 3] = 0;
    }
    ctx.putImageData(imageData, 0, 0);
}

// แปลงพิกัดเมาส์
function toScaledMouseCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: Math.floor((clientX - rect.left) * scaleX),
        y: Math.floor((clientY - rect.top) * scaleY)
    };
}

// ฟังก์ชันสลับเครื่องมือ + ปรับ UI ปุ่มกด
function setTool(newTool) {
    if (tool === 'eraser' && newTool !== 'eraser') {
        // คืนค่าสีเดิมถ้ายกเลิกการใช้ยางลบ
        r = savedR; g = savedG; b = savedB;
    } else if (newTool === 'eraser' && tool !== 'eraser') {
        // บันทึกสีเดิมก่อนสลับไปเป็นยางลบ (ระบายสีดำ/โปร่งใส)
        savedR = r; savedG = g; savedB = b;
    }

    tool = newTool;
    
    // ไฮไลต์ปุ่มที่เลือก
    document.querySelectorAll('.toolbar button').forEach(btn => btn.classList.remove('active-tool'));
    const activeBtn = document.getElementById(`btn-${newTool}`);
    if (activeBtn) activeBtn.classList.add('active-tool');
}

// การรับค่าสี/ความหนา
picker.addEventListener("input", function() {
    const hex = this.value;
    r = parseInt(hex.substr(1, 2), 16);
    g = parseInt(hex.substr(3, 2), 16);
    b = parseInt(hex.substr(5, 2), 16);
    savedR = r; savedG = g; savedB = b;
});

slider.addEventListener("input", function() {
    thickness = parseInt(this.value);
    thickValDisplay.innerText = thickness;
});

// Canvas Events
canvas.addEventListener('mousedown', function(event) {
    isDragging = true;
    const { x, y } = toScaledMouseCoords(event.clientX, event.clientY);
    startX = x;
    startY = y;
    previousMouseX = x;
    previousMouseY = y;

    if (tool === "pencil") {
        drawLineThick(x, y, x, y, r, g, b);
    } else if (tool === "eraser") {
        drawLineThick(x, y, x, y, 0, 0, 0, 0); // ลบเป็น pixel เปล่า
    }
    ctx.putImageData(imageData, 0, 0);
});

canvas.addEventListener('mousemove', function(event) {
    if (!isDragging) return;
    const { x, y } = toScaledMouseCoords(event.clientX, event.clientY);

    if (tool === "pencil") {
        drawLineThick(previousMouseX, previousMouseY, x, y, r, g, b);
    } else if (tool === "eraser") {
        drawLineThick(previousMouseX, previousMouseY, x, y, 0, 0, 0, 0);
    }

    previousMouseX = x;
    previousMouseY = y;
    ctx.putImageData(imageData, 0, 0);
});

canvas.addEventListener('mouseup', function(event) {
    if (!isDragging) return;
    isDragging = false;
    const { x, y } = toScaledMouseCoords(event.clientX, event.clientY);

    if (tool === "line") {
        drawLine(startX, startY, x, y, r, g, b);
    } else if (tool === "rect") {
        drawRect(startX, startY, x, y, r, g, b);
    } else if (tool === "circle") {
        let radius = Math.round(Math.sqrt((x - startX) ** 2 + (y - startY) ** 2));
        drawCircle(startX, startY, radius, r, g, b);
    }

    ctx.putImageData(imageData, 0, 0);
});

// --- KEYBOARD EVENT LISTENERS ---
window.addEventListener('keydown', function(event) {
    const key = event.key.toLowerCase();

    // เลือกเครื่องมือด้วยคีย์บอร์ด
    if (key === 'p') setTool('pencil');
    else if (key === 'l') setTool('line');
    else if (key === 'r') setTool('rect');
    else if (key === 'c') setTool('circle');
    else if (key === 'e') setTool('eraser');
    else if (event.key === 'Delete' || event.key === 'Backspace') clearCanvas();

    // ปรับความหนาเส้นด้วย [ และ ]
    else if (event.key === '[') {
        thickness = Math.max(1, thickness - 1);
        slider.value = thickness;
        thickValDisplay.innerText = thickness;
    } else if (event.key === ']') {
        thickness = Math.min(10, thickness + 1);
        slider.value = thickness;
        thickValDisplay.innerText = thickness;
    }

    // ปุ่มลัดเปลี่ยนสี
    else if (key === '1') { r = 255; g = 0; b = 0; picker.value = "#ff0000"; }
    else if (key === '2') { r = 0; g = 255; b = 0; picker.value = "#00ff00"; }
    else if (key === '3') { r = 0; g = 0; b = 255; picker.value = "#0000ff"; }
    else if (key === '0') { r = 0; g = 0; b = 0; picker.value = "#000000"; }
});

// กำหนดเครื่องมือเริ่มต้น
setTool('pencil');
</script>

</body>
</html>
