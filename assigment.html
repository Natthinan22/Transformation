<html>

<body>
<canvas id="canvas" width="200" height="200"
style="width:500px; height:500px; border:1px solid #000; image-rendering: pixelated;">
</canvas>
<button onclick="alert('Button clicked!')">Click Me!</button>
<div>
    <button onclick="tool='pencil'">Pencil</button>
    <button onclick="tool='line'">Line</button>
    <button onclick="tool='rect'">Rectangle</button>
    <button onclick="tool='circle'">Circle</button>
    <button onclick="clearCanvas()">Clear</button>
    <button onclick="tool='eraser'">Eraser</button>

    Color
    <input type="color" id="colorPicker" value="#000000">

    Thickness
    <input type="range" id="thick" min="1" max="10" value="1">
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const imageData = ctx.createImageData(canvas.width, canvas.height);
const data = imageData.data; // Array of color [R,G,B,A, R,G,B,A, ...]

function putPixel(x, y, r, g, b, a=255) {
    const index = (y * canvas.width + x) * 4;
    data[index] = r;     // Red
    data[index + 1] = g; // Green
    data[index + 2] = b; // Blue
    data[index + 3] = a; // Alpha
}

function drawLine(x1, y1, x2, y2, r, g, b, a = 255) {    // อันใหม่ 
  const dx = Math.abs(x2 - x1);
  const dy = Math.abs(y2 - y1);

  if(dx > dy) {
    const m = (y2 - y1) / (x2 - x1);
    const c = y1 - m * x1;
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
      const y = Math.round(m * x + c);
      putPixel(x, y, r, g, b, a);
    }
  } else {
    const m = (x2 - x1) / (y2 - y1);
    const c = x1 - m * y1;
    for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
      const x = Math.round(m * y + c);
      putPixel(x, y, r, g, b, a);
    }
  }
}
function drawRect(x1,y1,x2,y2,r,g,b,a = 255){
    drawLine(x1,y1,x2,y1,r,g,b,a); // Top edge
    drawLine(x2,y1,x2,y2,r,g,b,a); // Right edge
    drawLine(x2,y2,x1,y2,r,g,b,a); // Bottom edge
    drawLine(x1,y2,x1,y1,r,g,b,a); // Left edge
}

function drawRectFilled(x1,y1,x2,y2,r,g,b,a = 255){
    for(let y = y1; y <= y2; y++){
        for(let x = x1; x <= x2; x++){
                putPixel(x,y,r,g,b,a);
        }
    }
}

function clearCanvas(){

for(let i = 0; i < data.length; i += 4){

    data[i] = 0;
    data[i + 1] = 0;
    data[i + 2] = 0;
    data[i + 3] = 0;

    }
   ctx.putImageData(imageData, 0, 0);

}

function drawRectGradient(x1,y1,x2,y2, r1,g1,b1, r2,g2,b2, a = 255){
    for(let y = y1; y <= y2; y++){
        let t = (y - y1) / (y2 - y1);
        let r = Math.round(r1 * (1 - t) + r2 * t);
        let g = Math.round(g1 * (1 - t) + g2 * t);
        let b = Math.round(b1 * (1 - t) + b2 * t);
        for(let x = x1; x <= x2; x++){
            putPixel(x,y,r,g,b,a);
        }
    }
}

function drawCircle(cx, cy, radius, r, g, b, a = 255){
    drawEllipse(cx, cy, radius, radius, r, g, b, a);
}



function drawLineThick(x1,y1,x2,y2,r,g,b,a=255){

    for(let i=-Math.floor(thickness/2);i<=Math.floor(thickness/2);i++){

        drawLine(x1+i,y1,x2+i,y2,r,g,b,a);
        drawLine(x1,y1+i,x2,y2+i,r,g,b,a);

    }

}

function drawEllipse(cx, cy, rx, ry, r, g, b, a = 255) {
    for (let y = -ry; y <= ry; y++) {
        for (let x = -rx; x <= rx; x++) {
            if ((x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1) {
                putPixel(cx + x, cy + y, r, g, b, a);
            }
        }
    }
}

let previousMouseY = 0;
let r = 0;
let g = 0;
let b = 0;

let isWrite = false ;

let docircle = false ;

const picker = document.getElementById("colorPicker");
const slider = document.getElementById("thick");

picker.addEventListener("input", function(){

    const hex = this.value;

    r = parseInt(hex.substr(1,2),16);
    g = parseInt(hex.substr(3,2),16);
    b = parseInt(hex.substr(5,2),16);

});

slider.addEventListener("input", function(){

    thickness = parseInt(this.value);

});


function drawSprite(sprite, x, y, r, g, b, a = 255) {
    for (let j = 0; j < sprite.length; j++) {
        for (let i = 0; i < sprite[j].length; i++) {
            if (sprite[j][i] === 1) {
                putPixel(x + i, y + j, r, g, b, a);
            }
        }
    }
}

function toScaledMouseCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: Math.floor((clientX - rect.left) * scaleX),
        y: Math.floor((clientY - rect.top) * scaleY)
    };
}

canvas.addEventListener('click', function(event) {
    const { x, y } = toScaledMouseCoords(event.clientX, event.clientY);
    //console.log('clicked', x, y);
    //putPixel(x, y, 255, 0, 0); // Draw a red pixel on click
    ctx.putImageData(imageData, 0, 0);
});

canvas.addEventListener('mousedown', function(event) {
   
    isDragging = true;
    const { x, y } = toScaledMouseCoords(event.clientX, event.clientY);

    startX = x;
    startY = y;

    console.log('mousedown', x, y);
    putPixel(x, y, r, g, b); // Draw a red pixel on click
    ctx.putImageData(imageData, 0, 0);
});

canvas.addEventListener('mouseup', function(event) {
    isDragging = false;
    const { x, y } = toScaledMouseCoords(event.clientX, event.clientY);
    console.log('mouseup', x, y);
   // putPixel(x, y, 0, 0, 255); // Draw a red pixel on click
    ctx.putImageData(imageData, 0, 0);
    
    if(tool==="line"){

drawLine(startX,startY,x,y,r,g,b);

}
else if(tool==="rect"){

drawRect(startX,startY,x,y,r,g,b);

}
else if(tool==="circle"){

let radius=Math.round(
    Math.sqrt((x-startX)*(x-startX)+(y-startY)*(y-startY))
);

drawCircle(startX,startY,radius,r,g,b);

}

ctx.putImageData(imageData, 0, 0);

});
